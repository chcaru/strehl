[workspace]
resolver = "3"
# Optional experiment dependency keeps its own workspace; ordinary builds do not adopt it.
exclude = ["experiments/native-gpu-gather"]
members = [
    "crates/strehl-core",
    "crates/strehl-raw",
    "crates/strehl-plugin",
    "crates/strehl-cli",
    "crates/strehl-ui",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chcaru/strehl"
authors = ["Chris Caruso"]

[workspace.dependencies]
strehl-core = { path = "crates/strehl-core" }
strehl-raw = { path = "crates/strehl-raw" }
strehl-plugin = { path = "crates/strehl-plugin" }

anyhow = "1.0"
thiserror = "2.0"
rayon = "1.12"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RAW decode. LGPL-2.1 -- LINK ONLY, DO NOT READ. See AGENTS.md.
rawler = "0.7.2"

# Image output. MIT. Strips-only encoder; there is no tiled writer at 0.11.
tiff = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
