[package]
name = "strehl-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared nondestructive image development and HDR export for Strehl."

[dependencies]
anyhow.workspace = true
rayon.workspace = true
tiff.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11"
quick-xml = "0.41"
# Pure Rust builds avoid an external encoder, DLL, assembler or subprocess.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.9"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
