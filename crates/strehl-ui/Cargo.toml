[package]
name = "strehl-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native desktop workspace for Strehl RAW focus stacking."

[[bin]]
name = "strehl-ui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
strehl-core.workspace = true
strehl-edit.workspace = true
strehl-cli = { path = "../strehl-cli", features = ["temporal-energy"] }
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# eframe with defaults disabled does not enable any native graphics backend.
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"] }
rfd = "=0.15.4"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
# Reduced-IDCT camera browsing only; no additional Rayon decoder pool.
jpeg-decoder = { version = "=0.3.2", default-features = false }
raw-window-handle = "=0.6.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.58.0", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

[dev-dependencies]
tempfile = "3"
