[package]
name = "strehl-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sony focus-stack capture workspace and headless LAN service"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:wgpu", "dep:rfd", "dep:qrcode"]

[[bin]]
name = "strehl-capture"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "strehl-capture-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "strehl-capture-receiver"
path = "src/bin/receiver.rs"

[[bin]]
name = "strehl-sony-ptp"
path = "src/bin/sony-ptp.rs"

[dependencies]
strehl-raw-codec.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
base64 = "0.22"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util", "signal"] }
getrandom = "=0.3.4"
qrcode = { version = "=0.14.1", default-features = false, optional = true }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "=0.15.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fs2 = "0.4"
tempfile = "3"
rayon.workspace = true
zstd = { version = "=0.13.3", default-features = false }
tokio-util = { version = "0.7", features = ["io-util"] }
bytes = "1"
libloading = "=0.8.9"

[dev-dependencies]
tempfile = "3"
