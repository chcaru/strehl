[package]
name = "strehl-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SD-card-only Sony focus-stack capture workspace"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
base64 = "0.22"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
getrandom = "=0.3.4"
qrcode = { version = "=0.14.1", default-features = false }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "=0.15.4"

[dev-dependencies]
tempfile = "3"
