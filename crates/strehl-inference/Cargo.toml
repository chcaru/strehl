[package]
name = "strehl-inference"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated validated predictor infrastructure; no enabled photographic treatment."

# Keep the experimental runtime and its lockfile outside ordinary application builds.
[workspace]

[features]
default = []
tract-runtime = ["dep:tract"]

[dependencies]
anyhow = "1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.11"
tract = { version = "=0.23.9", default-features = false, optional = true }
