# Own workspace root, so the parent workspace does not adopt it and a normal
# `cargo build` at the repo root never compiles this.
[workspace]

[package]
name = "m7-gpu-focus"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# RAW decode. LGPL-2.1 -- LINK ONLY, DO NOT READ. See AGENTS.md.
rawler = "0.7.2"
rayon = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
