# Own workspace root, so the parent workspace does not adopt it and a normal
# `cargo build` at the repo root never compiles this.
[workspace]

[package]
name = "m78-blur-eq"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# RAW decode only. LGPL-2.1 -- LINK ONLY, DO NOT READ. See AGENTS.md.
rawler = "0.7.2"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
