# Experimental standalone library: normal workspace builds do not adopt it.
[workspace]

[package]
name = "strehl-native-gpu-gather"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
strehl-core = { path = "../../crates/strehl-core" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
