# Own workspace root, so the parent workspace does not adopt it and a normal
# `cargo build` at the repo root never compiles this. Follows
# `experiments/m10-deep-align`.
[workspace]

[package]
name = "m54-clip-mask"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The SHIPPED operator, by path. This harness must not re-implement the focus
# measure, the regulariser, the gate or the estimator -- if it did, it would be
# measuring its own arithmetic rather than the pipeline's.
strehl-core = { path = "../../crates/strehl-core" }
strehl-raw = { path = "../../crates/strehl-raw" }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
