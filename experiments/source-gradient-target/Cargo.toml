[package]
name = "strehl-source-gradient-target"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
strehl-core = { path = "../../crates/strehl-core", features = ["native-correction-variance"] }
anyhow = "=1.0.104"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
