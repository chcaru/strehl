name: Draft desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate public release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      toolchain: ${{ steps.version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a version-matching tag and public repository
        id: version
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          if os.environ["PRIVATE_REPOSITORY"] != "false":
              raise SystemExit("Public Sigstore release requires a public repository")
          tag = os.environ["GITHUB_REF"]
          if not re.fullmatch(r"refs/tags/v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag):
              raise SystemExit("Run this workflow on a version tag, not a branch")
          version = tag.removeprefix("refs/tags/v")
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          if manifest["workspace"]["package"]["version"] != version:
              raise SystemExit("Tag and Cargo workspace version differ")
          toolchain = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", toolchain):
              raise SystemExit("Release toolchain must be an exact Rust version")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\ncommit={commit}\ntoolchain={toolchain}\n")
          PY

  source:
    name: Prepare source and relink kit
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RUST_TOOLCHAIN: ${{ needs.validate.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Assemble locked sources, licenses and rebuild instructions
        run: python scripts/release-package.py --platform source --version "$VERSION" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: Package ${{ matrix.target }}
    needs: [validate, source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
            suffix: ".exe"
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            suffix: ""
          - runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            rustflags: ""
            suffix: ""
          - runner: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
            rustflags: ""
            suffix: ""
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RUST_TOOLCHAIN: ${{ needs.validate.outputs.toolchain }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      EXE_SUFFIX: ${{ matrix.suffix }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: source-kit
      - name: Verify and extract the delivered source kit
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          folder = pathlib.Path("source-kit")
          stem = f"Strehl-{os.environ['VERSION']}"
          manifest = json.loads((folder / f"{stem}-source-manifest.json").read_text(encoding="utf-8"))
          if manifest["source_commit"] != os.environ["SOURCE_COMMIT"] or manifest["version"] != os.environ["VERSION"]:
              raise SystemExit("Source kit manifest belongs to another release")
          name = f"{stem}-source-relink-kit.tar.gz"
          records = [item for item in manifest["artifacts"] if item["name"] == name]
          if len(records) != 1:
              raise SystemExit("Source kit manifest must name exactly one rebuild archive")
          archive = folder / name
          with archive.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if digest != records[0]["sha256"] or archive.stat().st_size != records[0]["bytes"]:
              raise SystemExit("Source kit archive does not match its manifest")
          with tarfile.open(archive) as stream:
              stream.extractall("build-kit", filter="data")
          source = pathlib.Path("build-kit/Strehl-source").resolve()
          receipt = json.loads((source / "release-source.json").read_text(encoding="utf-8"))
          if receipt["source_commit"] != os.environ["SOURCE_COMMIT"] or receipt["version"] != os.environ["VERSION"]:
              raise SystemExit("Extracted source identity differs from release")
          for item in receipt["files"]:
              path = (source / item["path"]).resolve()
              if not path.is_relative_to(source) or not path.is_file():
                  raise SystemExit("Invalid application path in source kit receipt")
              with path.open("rb") as stream:
                  if hashlib.file_digest(stream, "sha256").hexdigest() != item["sha256"]:
                      raise SystemExit(f"Extracted application source differs: {item['path']}")
          PY
      - name: Enable Linux native-library source packages
        if: runner.os == 'Linux'
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/strehl-source.list >/dev/null
          test -s /etc/apt/sources.list.d/strehl-source.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan1 libegl1 libgl1 libgles2 desktop-file-utils \
            libxinerama1 libxrender1 libxfixes3 libx11-xcb1 libxcb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libdecor-0-0 xkb-data \
            xvfb xauth mesa-vulkan-drivers
      - name: Install pinned native Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustc --version --verbose
      - name: Check generated assets and packaging controls
        working-directory: build-kit/Strehl-source
        run: |
          python -S crates/strehl-ui/assets/generate-icons.py --check
          python scripts/test-release-package.py -v
          python scripts/release-smoke.py --self-test
      - name: Test the delivered kit without network or private corpus inputs
        working-directory: build-kit/Strehl-source
        # Each fixture may start decoder workers; bound simultaneous fixture pools.
        run: cargo test --locked --offline -p strehl-ui -p strehl-edit --target "$TARGET" -- --test-threads=2
      - name: Build the shipped executable from the offline relink kit
        run: python build-kit/Strehl-source/scripts/release-rebuild.py --target "$TARGET"
      - name: Package and inspect native dependencies
        run: |
          python scripts/release-package.py \
            --platform "$PLATFORM" --target "$TARGET" --version "$VERSION" \
            --binary "build-kit/Strehl-source/target/$TARGET/release/strehl-ui$EXE_SUFFIX" \
            --notices "source-kit/Strehl-$VERSION-third-party-notices.zip" --output dist
      - name: Render the packaged native window
        run: |
          if [ "$PLATFORM" = linux ]; then
            # Only this smoke uses a software Vulkan adapter; shipped defaults stay intact.
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
            test -s "$VK_ICD_FILENAMES"
            export WGPU_BACKEND=vulkan
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/strehl-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              python scripts/release-smoke.py --platform "$PLATFORM" --target "$TARGET" --version "$VERSION"
          else
            python scripts/release-smoke.py --platform "$PLATFORM" --target "$TARGET" --version "$VERSION"
          fi
      - name: Save native window evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.target }}
          path: native-smoke/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft:
    name: Verify, sign and create draft
    needs: [validate, source, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Default success condition is intentional: any failed matrix leg blocks this job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: incoming
          merge-multiple: false
      - name: Require every expected asset and matching build manifest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          version = os.environ["VERSION"]
          stem = f"Strehl-{version}"
          targets = {
              "x86_64-pc-windows-msvc": ".zip",
              "x86_64-unknown-linux-gnu": ".AppImage",
              "aarch64-apple-darwin": ".zip",
              "x86_64-apple-darwin": ".zip",
          }
          manifests = {
              f"{stem}-source-manifest.json": {
                  f"{stem}-source-relink-kit.tar.gz",
                  f"{stem}-third-party-notices.zip",
              },
          }
          for target, extension in targets.items():
              manifests[f"{stem}-{target}-manifest.json"] = {f"{stem}-{target}{extension}"}
          manifests[f"{stem}-x86_64-unknown-linux-gnu-manifest.json"].add(
              f"{stem}-x86_64-unknown-linux-gnu-native-sources.tar.gz")
          expected = set(manifests).union(*manifests.values())
          incoming = list(pathlib.Path("incoming").rglob("*"))
          if any(path.is_symlink() for path in incoming):
              raise SystemExit("Release artifacts must not contain symlinks")
          files = [path for path in incoming if path.is_file()]
          names = [path.name for path in files]
          if len(names) != len(set(names)) or set(names) != expected:
              raise SystemExit(f"Unexpected release asset set: missing={expected-set(names)}, extra={set(names)-expected}, count={len(names)}")
          dist = pathlib.Path("dist")
          dist.mkdir()
          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f"Empty release asset: {path}")
              shutil.copyfile(path, dist / path.name)
          for name, payloads in manifests.items():
              manifest = json.loads((dist / name).read_text(encoding="utf-8"))
              if manifest["version"] != version or manifest["source_commit"] != os.environ["SOURCE_COMMIT"]:
                  raise SystemExit(f"Build identity mismatch: {name}")
              artifacts = manifest["artifacts"]
              if {item["name"] for item in artifacts} != payloads or len(artifacts) != len(payloads):
                  raise SystemExit(f"Manifest payload set mismatch: {name}")
              for artifact in artifacts:
                  payload = dist / artifact["name"]
                  with payload.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  if payload.stat().st_size != artifact["bytes"] or digest != artifact["sha256"]:
                      raise SystemExit(f"Manifest integrity mismatch: {payload.name}")
          sums = []
          for path in sorted(dist.iterdir()):
              with path.open("rb") as source:
                  sums.append(f"{hashlib.file_digest(source, 'sha256').hexdigest()}  {path.name}\n")
          (dist / "SHA256SUMS").write_text("".join(sums), encoding="utf-8", newline="\n")
          print(f"Verified {len(expected)} release payloads from {os.environ['SOURCE_COMMIT']}")
          PY
      - name: Attest release payloads and checksum manifest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify checksums and provenance
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cp "$PROVENANCE_BUNDLE" dist/release-provenance.sigstore.json
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          while read -r digest filename; do
            gh attestation verify "dist/$filename" --repo "$GITHUB_REPOSITORY" \
              --bundle dist/release-provenance.sigstore.json --cert-identity "$identity" \
              --source-digest "$SOURCE_COMMIT" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done < dist/SHA256SUMS
          gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --bundle dist/release-provenance.sigstore.json --cert-identity "$identity" \
            --source-digest "$SOURCE_COMMIT" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          Strehl desktop prerelease for Windows x64, Linux x64, macOS Apple silicon and macOS Intel.

          The app includes its processing engine. Download the package matching your system; the source/relink kit and native-library sources are also included.

          SHA256SUMS is signed with Sigstore. The accompanying bundle identifies this repository's tagged release workflow, and release-provenance.sigstore.json attests the packages and checksums. These are supply-chain signatures, not Windows Authenticode or Apple Developer ID/notarization.

          See docs/development/release-workflow.md in the tagged source for verification instructions and platform requirements.

          This remains a draft until all four packages and their verification records have been reviewed.
          EOF
      - name: Create draft prerelease only
        # Existing releases deliberately fail here; reruns never overwrite published assets.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$current_commit" = "$SOURCE_COMMIT"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --title "Strehl $VERSION" --notes-file release-notes.md
